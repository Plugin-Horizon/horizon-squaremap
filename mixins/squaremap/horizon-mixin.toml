[mod]
id = "squaremap"
version = "0.3.0"
priority = 0

[compatibility]
horizon_revision = "PIN"

# The renderer, tiles, JSON documents and web server (no game types).
[[crate]]
id = "core"
path = "core"
dependent = "horizon-client"

# The game side: chunk snapshots, map colours and tints, border, player reads, markers
# (hooks-all helpers: native_chunk_snapshot, native_block_map_color, native_biome_tint,
# native_world_border, native_server_players and the player reads).
[[module]]
id = "glue"
file = "crates/horizon-client/src/game.rs"
name = "squaremap_glue"
source = "glue.rs"

[[injection]]
id = "register-config"
hook = "register_configs"
hook_version = 1
kind = "HEAD"
helper = "register_config.rs"
bindings = [
  { name = "list", ty = "&mut Vec<crate::game::native_configs::NativeConfig>", value = "&mut *configs" },
]

[[injection]]
id = "config-loading"
hook = "config_loading"
hook_version = 1
kind = "HEAD"
helper = "config_loading.rs"
bindings = [
  { name = "file", ty = "&crate::game::native_configs::NativeConfigFile", value = "config" },
]

[[injection]]
id = "config-reloading"
hook = "config_reloading"
hook_version = 1
kind = "HEAD"
helper = "config_reloading.rs"
bindings = [
  { name = "file", ty = "&crate::game::native_configs::NativeConfigFile", value = "config" },
]

[[injection]]
id = "world-phase"
hook = "world_lifecycle"
hook_version = 1
kind = "HEAD"
helper = "world_phase.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "world_phase", ty = "horizon_client::mod_api::WorldPhase", value = "phase" },
]

# Once a server tick, at its end: every level's due chunks (native_chunk_snapshot works for
# the level in place and for open levels nobody is in), markers and players.
[[injection]]
id = "server-ticked"
hook = "server_tick"
hook_version = 1
kind = "HEAD"
helper = "server_ticked.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "phase", ty = "horizon_client::mod_api::ServerTickPhase", value = "phase" },
]

[[injection]]
id = "chunk-loaded"
hook = "chunk_load"
hook_version = 1
kind = "HEAD"
helper = "chunk_loaded.rs"
bindings = [
  { name = "level", ty = "&str", value = "dimension" },
  { name = "pos", ty = "[i32; 2]", value = "chunk" },
  { name = "fresh", ty = "bool", value = "new" },
]

[[injection]]
id = "block-changed"
hook = "block_changed"
hook_version = 1
kind = "HEAD"
helper = "block_changed.rs"
bindings = [
  { name = "level", ty = "horizon_world::level::Dimension", value = "dimension" },
  { name = "at", ty = "horizon_core::position::BlockPos", value = "pos" },
]

[[injection]]
id = "chunk-unloaded"
hook = "chunk_unload"
hook_version = 1
kind = "HEAD"
helper = "chunk_unloaded.rs"
bindings = [
  { name = "level", ty = "&str", value = "dimension" },
  { name = "pos", ty = "[i32; 2]", value = "chunk" },
]

[[injection]]
id = "register-commands"
hook = "register_commands"
hook_version = 1
kind = "HEAD"
helper = "register_commands.rs"
bindings = [
  { name = "list", ty = "&mut Vec<crate::game::native_server::NativeCommand>", value = "commands" },
]

[[injection]]
id = "perform-command"
hook = "perform_command"
hook_version = 1
kind = "HEAD"
helper = "perform_command.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "sender", ty = "&crate::game::native_server::NativeServerPlayer", value = "player" },
  { name = "line", ty = "&str", value = "command" },
  { name = "handled", ty = "&mut bool", value = "ran" },
]

[[injection]]
id = "console-command"
hook = "perform_console_command"
hook_version = 1
kind = "HEAD"
helper = "console_command.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "line", ty = "&str", value = "command" },
  { name = "handled", ty = "&mut bool", value = "ran" },
]

# The world names of the first argument (the usages ask for them with `word?`).
[[injection]]
id = "tab-complete"
hook = "tab_complete"
hook_version = 1
kind = "HEAD"
helper = "tab_complete.rs"
bindings = [
  { name = "command", ty = "&str", value = "command" },
  { name = "range", ty = "[usize; 2]", value = "range" },
  { name = "suggestions", ty = "&mut Vec<horizon_client::mod_api::Suggestion>", value = "&mut *suggestions" },
]
