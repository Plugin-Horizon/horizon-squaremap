# squaremap for Horizon. Key names follow squaremap's config.yml and advanced.yml.
# Server config: written to config/squaremap-server.toml when missing; a world's
# serverconfig/squaremap-server.toml wins over it. Changes are picked up on save,
# except the web server (bind/port), which is read when the world opens.

[settings]
# The map's address as players open it, for `/squaremap link`.
web-address = "http://localhost:8080"

[settings.web-directory]
# Relative to the world folder, or absolute.
path = "squaremap/web"
# Write the bundled web frontend into the folder on every start.
auto-update = true

[settings.internal-webserver]
enabled = true
# 127.0.0.1 by default: put a reverse proxy in front to publish the map.
bind = "127.0.0.1"
port = 8080

[settings.ui.coordinates]
enabled = true

[settings.ui.link]
enabled = true

[settings.ui.sidebar]
pinned = "unpinned"

# Tiles are PNGs; with this on, value 0.0 to 1.0 sets how hard they are compressed
# (deflate level 9 * value). Off: the encoder's balanced default.
[settings.image-quality.compress-images]
enabled = false
value = 0.0

# Progress lines of full and radius renders on the console. Changed at runtime with
# `/squaremap progresslogging toggle|rate <seconds>` (not written back to this file).
[settings.render-progress-logging]
enabled = true
interval-seconds = 1

# Read when the world opens.
[settings.commands]
main-command-label = "squaremap"
main-command-aliases = ["map"]

[world-settings.default]
invisible-blocks = [
    "minecraft:tall_grass",
    "minecraft:fern",
    "minecraft:short_grass",
    "minecraft:large_fern",
    "minecraft:bush",
    "minecraft:short_dry_grass",
    "minecraft:tall_dry_grass",
]
# The blocks `map.iterate-up` stops at (the nether floor).
iterate-up-base-blocks = [
    "minecraft:netherrack",
    "minecraft:glowstone",
    "minecraft:soul_sand",
    "minecraft:soul_soil",
    "minecraft:gravel",
    "minecraft:warped_nylium",
    "minecraft:crimson_nylium",
    "minecraft:nether_gold_ore",
    "minecraft:ancient_debris",
    "minecraft:nether_quartz_ore",
    "minecraft:magma_block",
    "minecraft:basalt",
]

[world-settings.default.map]
enabled = true
display-name = "{world}"
order = 0
icon = ""
# Scan a ceiling level from the bottom up to the first base block (see
# iterate-up-base-blocks) instead of from below the roof down.
iterate-up = false
max-height = -1

[world-settings.default.map.biomes]
enabled = true
blend-biomes = 3

[world-settings.default.map.glass]
clear = true

[world-settings.default.map.lava]
checkerboard = true

[world-settings.default.map.water]
clear-depth = true
checkerboard = false

[world-settings.default.map.zoom]
maximum = 3
default = 3
extra = 2

[world-settings.default.map.markers]
update-interval-seconds = 5

[world-settings.default.map.markers.spawn-icon]
enabled = true
show-controls = true
default-hidden = false
layer-priority = 0
z-index = 0

[world-settings.default.map.markers.world-border]
enabled = true
show-controls = true
default-hidden = false
layer-priority = 1
z-index = 1

# Columns outside every enabled shape stay empty; no shape: everything is drawn.
# type = "rectangle": min-x, min-z, max-x, max-z (inclusive)
# type = "circle": center-x, center-z, radius
# type = "polygon": points = ["x, z", "x, z", ...]
# type = "world-border": the level's world border
[[world-settings.default.map.visibility-limits]]
type = "rectangle"
enabled = false
min-x = -10000
min-z = -10000
max-x = 10000
max-z = 10000

# Changed chunks (blocks set, new chunks generated) are rendered in batches.
[world-settings.default.map.render.background]
enabled = true
interval-seconds = 15
max-chunks-per-interval = 2048

[world-settings.default.player-tracker]
enabled = true
update-interval-seconds = 1
show-controls = true
default-hidden = false
layer-priority = 2
z-index = 2
# Show a player's nickname (set by another mod) instead of their name.
use-display-names = false

[world-settings.default.player-tracker.nameplate]
enabled = true
show-head = true
heads-url = "https://mc-heads.net/avatar/{uuid}/16"
show-armor = true
show-health = true

[world-settings.default.player-tracker.hide]
invisible = true
spectators = true
map-invisibility-equipment = true

