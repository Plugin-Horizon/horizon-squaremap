description = "squaremap for Horizon: tile renderer, marker/player JSON and the internal web server (no Horizon types)"

[dependencies]
flate2 = "1"
png = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"
