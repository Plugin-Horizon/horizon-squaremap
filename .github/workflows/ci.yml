name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Horizon SDK note
        run: echo "::notice::Full build and unit tests need the Horizon SDK (horizon-mod-api at 5ef7734, fetched into .horizon/sdk by cargo horizon-mod, not in the repo). They run on the maintainer's machine. This job checks only what needs no SDK."
      - name: Manifests parse
        run: python3 -c 'import tomllib; [tomllib.load(open(f, "rb")) for f in ("Cargo.toml", "horizon-mod.toml")]; print("Cargo.toml and horizon-mod.toml parse")'
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Rust sources parse (rustfmt, no formatting check)
        run: |
          edition=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"].get("edition", "2015"))')
          find src -name '*.rs' -print0 | xargs -0 rustfmt --edition "$edition" --emit stdout > /dev/null
